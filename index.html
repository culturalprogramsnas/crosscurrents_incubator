<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosscurrents Database — Participant Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0f4a58;
    --teal-800:#125c6d;
    --teal-700:#166f84;
    --teal-600:#1a86a0;
    --teal-active:#0d5566;
    --ink:#1d2b32;
    --muted:#6b7c84;
    --line:#e3e9ec;
    --bg:#f4f7f8;
    --card:#ffffff;
    --pill-blue-bg:#eef4fb;
    --pill-blue-text:#2f6fa8;
    --pill-grey-bg:#eef1f2;
    --pill-grey-text:#4c5c63;
    --accent:#2f6fa8;
    --radius-lg:14px;
    --radius-md:10px;
    --shadow:0 1px 3px rgba(15,40,48,.08), 0 8px 24px rgba(15,40,48,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  /* ---------- Password Gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--teal-900),var(--teal-700));
  }
  #gate .box{
    background:var(--card);
    width:min(360px,88vw);
    padding:36px 32px 30px;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    text-align:center;
  }
  #gate .box h1{
    font-family:'Rubik',sans-serif;
    font-size:20px; margin:0 0 4px;
    color:var(--teal-900);
  }
  #gate .box p{
    font-size:13px; color:var(--muted); margin:0 0 22px;
  }
  #gate input{
    width:100%; padding:11px 13px;
    border:1px solid var(--line); border-radius:var(--radius-md);
    font-size:14px; outline:none; margin-bottom:12px;
    font-family:inherit;
  }
  #gate input:focus{ border-color:var(--teal-600); box-shadow:0 0 0 3px rgba(26,134,160,.15); }
  #gate button{
    width:100%; padding:11px 13px; border:none; border-radius:var(--radius-md);
    background:var(--teal-700); color:#fff; font-weight:600; font-size:14px;
    cursor:pointer; transition:background .15s;
    font-family:inherit;
  }
  #gate button:hover{ background:var(--teal-active); }
  #gateError{
    color:#c14545; font-size:12.5px; height:16px; margin-top:10px;
  }

  /* ---------- App shell ---------- */
  #app{ display:none; height:100vh; flex-direction:column; }
  #app.visible{ display:flex; }

  .top-accent{ height:4px; flex:0 0 4px; background:linear-gradient(90deg,#2f6fa8,#1a86a0); }

  /* Main */
  .main{ flex:1; display:flex; flex-direction:column; overflow:auto; width:100%; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; background:#fff; border-bottom:1px solid var(--line);
  }
  .breadcrumb{ font-size:13.5px; color:var(--muted); }
  .breadcrumb b{ color:var(--ink); font-weight:600; }
  .topbar-icons{ display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; }

  .icon-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:1px solid transparent; border-radius:7px;
    padding:6px 10px; font-size:13.5px; color:var(--muted); cursor:pointer;
    font-family:inherit; transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{ background:#f2f6f7; color:var(--ink); }
  .icon-btn.active{ background:var(--pill-blue-bg); color:var(--pill-blue-text); border-color:#d7e6f3; }
  .icon-btn .count{
    background:var(--teal-700); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:9px; padding:1px 6px; line-height:1.4;
  }

  .popover-wrap{ position:relative; }
  .popover{
    display:none;
    position:absolute; top:calc(100% + 8px); right:0; z-index:20;
    width:280px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 12px rgba(15,40,48,.1), 0 12px 32px rgba(15,40,48,.12);
    overflow:hidden;
  }
  .popover.open{ display:block; }
  .popover-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--ink);
  }
  .popover-close{
    background:none; border:none; font-size:16px; line-height:1; color:var(--muted);
    cursor:pointer; padding:2px 4px;
  }
  .popover-close:hover{ color:var(--ink); }
  .popover-body{ padding:12px 14px; max-height:320px; overflow:auto; }
  .popover-group + .popover-group{ margin-top:14px; }
  .popover-group-title{
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .check-list{ display:flex; flex-direction:column; gap:2px; }
  .check-row{
    display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink);
    padding:5px 6px; border-radius:6px; cursor:pointer;
  }
  .check-row:hover{ background:#f4f7f8; }
  .check-row input{ accent-color:var(--teal-700); width:14px; height:14px; flex:0 0 14px; }
  .check-count{ color:var(--muted); font-size:11.5px; margin-left:auto; }
  .radio-row{
    display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink);
    padding:7px 6px; border-radius:6px; cursor:pointer;
  }
  .radio-row:hover{ background:#f4f7f8; }
  .radio-row input{ accent-color:var(--teal-700); width:14px; height:14px; }
  .popover-footer{
    padding:10px 14px; border-top:1px solid var(--line);
  }
  .popover-clear{
    background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600;
    cursor:pointer; padding:0; font-family:inherit;
  }
  .popover-clear:hover{ text-decoration:underline; }
  .empty-note{ font-size:12.5px; color:var(--muted); padding:4px 6px; }

  .content{ padding:26px 32px 40px; max-width:900px; width:100%; margin:0 auto; }
  .content-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .content-header h2{
    font-family:'Rubik',sans-serif; font-size:24px; margin:0; color:var(--teal-900);
  }
  .counter{ font-size:13px; color:var(--muted); }

  .card{
    background:var(--card); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); border:1px solid var(--line);
    overflow:hidden;
  }
  .card-top{
    display:flex; gap:22px; padding:22px;
    border-bottom:1px solid var(--line);
  }
  .photo-wrap{
    width:180px; height:180px; flex:0 0 180px;
    border-radius:12px; overflow:hidden; background:var(--teal-800);
    display:flex; align-items:center; justify-content:center;
  }
  .photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-fallback{
    color:#fff; font-family:'Rubik',sans-serif; font-size:44px; font-weight:600;
  }

  .info{ flex:1; min-width:0; padding-top:2px; }
  .info-row-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .name{ font-family:'Rubik',sans-serif; font-weight:600; font-size:20px; color:var(--ink); margin:0 0 10px; }
  .tag{
    display:inline-block; padding:4px 12px; border-radius:20px;
    font-size:12px; font-weight:600; white-space:nowrap;
    background:var(--pill-grey-bg); color:var(--pill-grey-text);
  }
  .field{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink); margin-bottom:8px; }
  .field .ic{ width:16px; text-align:center; color:var(--muted); font-size:13px; flex:0 0 16px; }
  .field a{ color:var(--accent); text-decoration:none; }
  .field a:hover{ text-decoration:underline; }
  .pill{
    display:inline-block; background:var(--pill-blue-bg); color:var(--pill-blue-text);
    padding:3px 10px; border-radius:6px; font-size:12.5px; font-weight:500;
  }
  .field-group{ margin-top:2px; }
  .field-group .field{ margin-bottom:9px; }
  .field-group .sub{ padding-left:25px; margin-top:-3px; margin-bottom:10px; }

  .bio-section{ padding:20px 22px 24px; }
  .bio-label{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--muted);
    text-transform:uppercase; margin-bottom:10px;
  }
  .bio-text{ font-size:13.6px; line-height:1.6; color:#33454c; white-space:pre-line; }
  .bio-text.clamped{
    display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bio-toggle{
    margin-top:10px; background:none; border:none; color:var(--accent);
    font-size:12.5px; font-weight:600; cursor:pointer; padding:0; font-family:inherit;
  }

  .nav-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:22px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:6px;
    padding:9px 18px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:background .15s, border-color .15s;
  }
  .nav-btn:hover:not(:disabled){ background:#f2f6f7; border-color:#c9d5d9; }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .dots{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    margin-top:18px; max-width:520px; margin-left:auto; margin-right:auto;
  }
  .dot{
    width:7px; height:7px; border-radius:50%; background:#c7d3d7; cursor:pointer;
    border:none; padding:0; transition:background .15s, transform .15s;
  }
  .dot:hover{ background:#9db3ba; }
  .dot.active{ background:var(--teal-700); transform:scale(1.35); }

  .search-box{
    max-width:900px; margin:0 auto 14px; width:100%;
  }
  .search-box input{
    width:100%; padding:9px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:13.5px; font-family:inherit; outline:none;
  }
  .search-box input:focus{ border-color:var(--teal-600); }

  .status-msg{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }

  @media (max-width:720px){
    .content{ padding:18px; }
    .card-top{ flex-direction:column; }
    .photo-wrap{ width:120px; height:120px; }
    .popover{ width:min(280px,88vw); right:-10px; }
  }
</style>
</head>
<body>

  <!-- ===================== PASSWORD GATE ===================== -->
  <div id="gate">
    <div class="box">
      <h1>Crosscurrents Database</h1>
      <p>Enter the password to view the Participant Roster.</p>
      <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
      <button id="pwSubmit">Unlock</button>
      <div id="gateError"></div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app">
    <div class="top-accent"></div>
    <div class="main">
      <div class="topbar">
        <div class="breadcrumb">Roster &nbsp;›&nbsp; <b>Participant Roster</b></div>
        <div class="topbar-icons">

          <div class="popover-wrap">
            <button class="icon-btn" id="filterBtn">Filter <span class="count" id="filterCount" style="display:none;"></span></button>
            <div class="popover" id="filterPopover">
              <div class="popover-header">
                <span>Filter</span>
                <button class="popover-close" data-close>&times;</button>
              </div>
              <div class="popover-body">
                <div class="popover-group">
                  <div class="popover-group-title">Role</div>
                  <div class="check-list" id="roleChecks"></div>
                </div>
                <div class="popover-group">
                  <div class="popover-group-title">Assigned Challenge / Working Group</div>
                  <div class="check-list" id="groupChecks"></div>
                </div>
              </div>
              <div class="popover-footer">
                <button class="popover-clear" id="filterClearBtn">Clear filters</button>
              </div>
            </div>
          </div>

          <div class="popover-wrap">
            <button class="icon-btn" id="sortBtn">Sort</button>
            <div class="popover" id="sortPopover">
              <div class="popover-header">
                <span>Sort by Roster Name</span>
                <button class="popover-close" data-close>&times;</button>
              </div>
              <div class="popover-body">
                <label class="radio-row"><input type="radio" name="sortDir" value="none" checked> No sort (roster order)</label>
                <label class="radio-row"><input type="radio" name="sortDir" value="asc"> A → Z</label>
                <label class="radio-row"><input type="radio" name="sortDir" value="desc"> Z → A</label>
              </div>
            </div>
          </div>

          <span class="icon-btn" id="searchIconBtn" title="Search">🔍</span>
          <span class="icon-btn" style="cursor:default;">⋯</span>
        </div>
      </div>

      <div class="content">
        <div class="content-header">
          <h2>Participant Roster</h2>
          <span class="counter" id="counter">– of –</span>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by name, organization, working group, or role…">
        </div>

        <div id="cardHost">
          <div class="status-msg">Loading roster…</div>
        </div>

        <div class="nav-row" id="navRow" style="display:none;">
          <button class="nav-btn" id="prevBtn">← Previous</button>
          <button class="nav-btn" id="nextBtn">Next →</button>
        </div>

        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>

<script>
/* =========================================================================
   CONFIGURATION
   - Change PASSWORD below to whatever you'd like the roster to be locked
     with. This is a lightweight, client-side gate meant to keep casual
     visitors out — it is NOT strong security (anyone who views the page
     source or browser devtools could find the check). Don't use it to
     protect sensitive data.
   - CSV_PATH / PHOTO_DIR assume this HTML file, the CSV, and the photos
     all live in the same folder, and that the page is served over
     http(s) (e.g. `python3 -m http.server`) rather than opened directly
     as a file:// URL, since browsers block fetch() of local files.
   ========================================================================= */
  const PASSWORD  = "Crosscurrents2026";
  const CSV_PATH  = "ParticipantRoster.csv";
  const PHOTO_DIR = "";

  /* ---------------- Password gate logic ---------------- */
  const gate = document.getElementById('gate');
  const app  = document.getElementById('app');
  const pwInput = document.getElementById('pwInput');
  const pwSubmit = document.getElementById('pwSubmit');
  const gateError = document.getElementById('gateError');

  function tryUnlock(){
    if(pwInput.value === PASSWORD){
      sessionStorage.setItem('crosscurrents_unlocked', '1');
      gate.style.display = 'none';
      app.classList.add('visible');
      init();
    } else {
      gateError.textContent = 'Incorrect password. Please try again.';
      pwInput.value = '';
      pwInput.focus();
    }
  }
  pwSubmit.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

  // Skip the gate within the same browser tab session once unlocked
  if(sessionStorage.getItem('crosscurrents_unlocked') === '1'){
    gate.style.display = 'none';
    app.classList.add('visible');
    window.addEventListener('DOMContentLoaded', init);
  } else {
    window.addEventListener('DOMContentLoaded', () => pwInput.focus());
  }

  /* ---------------- CSV parsing (vanilla, RFC4180-ish) ---------------- */
  function parseCSV(text){
    const rows = [];
    let field = '', row = [], inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\r'){ /* ignore */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += c; }
      }
    }
    if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0] === ''));
  }

  function stripStrayQuotes(s){
    if(!s) return s;
    let t = s.trim();
    // Collapse leftover literal quote characters produced by doubled
    // quotes inside already-quoted CSV fields, e.g. """Foo, Bar""" -> "Foo, Bar" -> Foo, Bar
    while(t.startsWith('"') && t.endsWith('"') && t.length > 1){ t = t.slice(1, -1).trim(); }
    return t;
  }

  function rowsToObjects(rows){
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).filter(r => r.some(c => c.trim() !== '')).map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = stripStrayQuotes(r[i] || ''); });
      return obj;
    });
  }

  function extractPhotoFilename(raw){
    if(!raw) return '';
    // Airtable exports often look like "Name.jpg (https://...)" — keep just the filename
    const idx = raw.indexOf(' (');
    const name = idx > -1 ? raw.slice(0, idx) : raw;
    return name.trim();
  }

  function initials(name){
    return (name || '?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }

  /* ---------------- App state & rendering ---------------- */
  let participants = [];
  let filtered = [];
  let current = 0;
  let searchQuery = '';
  let sortDir = 'none';        // 'none' | 'asc' | 'desc'
  const activeRoles = new Set();
  const activeGroups = new Set();

  async function init(){
    try{
      const res = await fetch(CSV_PATH, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      let text = await res.text();
      text = text.replace(/^\uFEFF/, ''); // strip UTF-8 BOM some exports (e.g. Airtable) include
      const rows = parseCSV(text);
      participants = rowsToObjects(rows).map(p => ({
        photoFile: extractPhotoFilename(p['Photo']),
        email: p['Email Address'] || '',
        name: p['Roster Name'] || '(No name)',
        title: p['Title'] || '',
        org: p['Organization'] || '',
        bio: p['Bio for Conference Roster'] || '',
        group: p['Assigned Challenge / Working Group'] || '',
        role: p['Role'] || ''
      }));
      current = 0;
      buildFilterOptions();
      applyFiltersSort();

      document.getElementById('searchInput').addEventListener('input', onSearch);
      document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
      document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));
      document.addEventListener('keydown', e => {
        if(app.classList.contains('visible') && !isPopoverOpen()){
          if(e.key === 'ArrowLeft') go(current - 1);
          if(e.key === 'ArrowRight') go(current + 1);
        }
      });

      document.getElementById('searchIconBtn').addEventListener('click', () => {
        document.getElementById('searchInput').focus();
      });

      initPopovers();
      updateFilterButtonState();
      updateSortButtonState();
    } catch(err){
      document.getElementById('cardHost').innerHTML =
        `<div class="status-msg">Couldn't load <b>${CSV_PATH}</b>.<br>
         Make sure this file, the CSV, and the photos are in the same folder,
         and that you're viewing this page via a local web server (not double-clicked
         as a file). <br><br><span style="font-size:12px;">(${err.message})</span></div>`;
    }
  }

  /* ---------------- Filter / Sort popovers ---------------- */
  function uniqueSorted(values){
    return [...new Set(values.map(v => (v || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b));
  }

  function buildFilterOptions(){
    const roles = uniqueSorted(participants.map(p => p.role));
    const groups = uniqueSorted(participants.map(p => p.group));

    const roleHost = document.getElementById('roleChecks');
    roleHost.innerHTML = roles.length ? roles.map(r => {
      const count = participants.filter(p => p.role === r).length;
      return `<label class="check-row">
        <input type="checkbox" value="${escapeHtml(r)}" data-kind="role">
        ${escapeHtml(r)}<span class="check-count">${count}</span>
      </label>`;
    }).join('') : '<div class="empty-note">No role values found.</div>';

    const groupHost = document.getElementById('groupChecks');
    groupHost.innerHTML = groups.length ? groups.map(g => {
      const count = participants.filter(p => p.group === g).length;
      return `<label class="check-row">
        <input type="checkbox" value="${escapeHtml(g)}" data-kind="group">
        ${escapeHtml(g)}<span class="check-count">${count}</span>
      </label>`;
    }).join('') : '<div class="empty-note">No working group values found.</div>';

    roleHost.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        cb.checked ? activeRoles.add(cb.value) : activeRoles.delete(cb.value);
        current = 0;
        applyFiltersSort();
        updateFilterButtonState();
      });
    });
    groupHost.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        cb.checked ? activeGroups.add(cb.value) : activeGroups.delete(cb.value);
        current = 0;
        applyFiltersSort();
        updateFilterButtonState();
      });
    });
  }

  function initPopovers(){
    const filterBtn = document.getElementById('filterBtn');
    const filterPop = document.getElementById('filterPopover');
    const sortBtn = document.getElementById('sortBtn');
    const sortPop = document.getElementById('sortPopover');

    function closeAll(){
      filterPop.classList.remove('open');
      sortPop.classList.remove('open');
    }
    function toggle(pop){
      const willOpen = !pop.classList.contains('open');
      closeAll();
      if(willOpen) pop.classList.add('open');
    }

    filterBtn.addEventListener('click', e => { e.stopPropagation(); toggle(filterPop); });
    sortBtn.addEventListener('click', e => { e.stopPropagation(); toggle(sortPop); });

    document.querySelectorAll('.popover-close').forEach(btn => {
      btn.addEventListener('click', closeAll);
    });

    document.addEventListener('click', e => {
      if(!e.target.closest('.popover-wrap')) closeAll();
    });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAll(); });

    document.getElementById('filterClearBtn').addEventListener('click', () => {
      activeRoles.clear();
      activeGroups.clear();
      document.querySelectorAll('#roleChecks input, #groupChecks input').forEach(cb => cb.checked = false);
      current = 0;
      applyFiltersSort();
      updateFilterButtonState();
    });

    document.querySelectorAll('input[name="sortDir"]').forEach(radio => {
      radio.addEventListener('change', () => {
        sortDir = radio.value;
        applyFiltersSort();
        updateSortButtonState();
      });
    });
  }

  function isPopoverOpen(){
    return !!document.querySelector('.popover.open');
  }

  function updateFilterButtonState(){
    const btn = document.getElementById('filterBtn');
    const badge = document.getElementById('filterCount');
    const total = activeRoles.size + activeGroups.size;
    btn.classList.toggle('active', total > 0);
    if(total > 0){ badge.style.display = 'inline'; badge.textContent = total; }
    else { badge.style.display = 'none'; }
  }

  function updateSortButtonState(){
    const btn = document.getElementById('sortBtn');
    btn.classList.toggle('active', sortDir !== 'none');
    btn.innerHTML = sortDir === 'asc' ? 'Sort <span>A→Z</span>'
      : sortDir === 'desc' ? 'Sort <span>Z→A</span>'
      : 'Sort';
  }

  /* ---------------- Combined search + filter + sort ---------------- */
  function applyFiltersSort(){
    let list = participants;

    if(searchQuery){
      list = list.filter(p =>
        [p.name, p.org, p.group, p.role, p.title].join(' ').toLowerCase().includes(searchQuery)
      );
    }
    if(activeRoles.size > 0){
      list = list.filter(p => activeRoles.has(p.role));
    }
    if(activeGroups.size > 0){
      list = list.filter(p => activeGroups.has(p.group));
    }

    list = list.slice();
    if(sortDir === 'asc'){
      list.sort((a,b) => a.name.localeCompare(b.name));
    } else if(sortDir === 'desc'){
      list.sort((a,b) => b.name.localeCompare(a.name));
    }

    filtered = list;
    if(current >= filtered.length) current = 0;
    render();
  }

  function onSearch(e){
    searchQuery = e.target.value.trim().toLowerCase();
    current = 0;
    applyFiltersSort();
  }

  function go(i){
    if(i < 0 || i >= filtered.length) return;
    current = i;
    render();
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    const host = document.getElementById('cardHost');
    const counter = document.getElementById('counter');
    const navRow = document.getElementById('navRow');
    const dotsWrap = document.getElementById('dots');

    if(filtered.length === 0){
      host.innerHTML = '<div class="status-msg">No participants match your search.</div>';
      counter.textContent = '0 of ' + participants.length;
      navRow.style.display = 'none';
      dotsWrap.innerHTML = '';
      return;
    }

    const p = filtered[current];
    counter.textContent = (current + 1) + ' of ' + filtered.length;
    navRow.style.display = 'flex';
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === filtered.length - 1;

    const photoSrc = p.photoFile ? (PHOTO_DIR + p.photoFile) : '';
    const photoHtml = photoSrc
      ? `<img src="${escapeHtml(photoSrc)}" alt="${escapeHtml(p.name)}" onerror="this.parentElement.innerHTML='<div class=&quot;photo-fallback&quot;>${initials(p.name)}</div>'">`
      : `<div class="photo-fallback">${initials(p.name)}</div>`;

    host.innerHTML = `
      <div class="card">
        <div class="card-top">
          <div class="photo-wrap">${photoHtml}</div>
          <div class="info">
            <div class="info-row-top">
              <h3 class="name">${escapeHtml(p.name)}</h3>
              ${p.role ? `<span class="tag">${escapeHtml(p.role)}</span>` : ''}
            </div>
            <div class="field-group">
              ${p.email ? `<div class="field"><span class="ic">✉</span><a href="mailto:${escapeHtml(p.email)}">${escapeHtml(p.email)}</a></div>` : ''}
              ${(p.title || p.org) ? `<div class="field"><span class="ic">🏢</span>${escapeHtml(p.title)}</div>` : ''}
              ${p.org ? `<div class="sub"><span class="pill">${escapeHtml(p.org)}</span></div>` : ''}
              ${p.group ? `<div class="field"><span class="ic">👥</span><span class="pill">${escapeHtml(p.group)}</span></div>` : ''}
            </div>
          </div>
        </div>
        ${p.bio ? `
        <div class="bio-section">
          <div class="bio-label">📋&nbsp; Biography</div>
          <div class="bio-text clamped" id="bioText">${escapeHtml(p.bio)}</div>
          <button class="bio-toggle" id="bioToggle">Show more</button>
        </div>` : ''}
      </div>
    `;

    const bioText = document.getElementById('bioText');
    const bioToggle = document.getElementById('bioToggle');
    if(bioText && bioToggle){
      // Only show the toggle if the text actually overflows the clamp
      requestAnimationFrame(() => {
        if(bioText.scrollHeight <= bioText.clientHeight + 4){
          bioToggle.style.display = 'none';
        }
      });
      bioToggle.addEventListener('click', () => {
        bioText.classList.toggle('clamped');
        bioToggle.textContent = bioText.classList.contains('clamped') ? 'Show more' : 'Show less';
      });
    }

    // Pagination dots
    dotsWrap.innerHTML = filtered.map((_, i) =>
      `<button class="dot ${i === current ? 'active' : ''}" title="${i+1}" data-i="${i}"></button>`
    ).join('');
    dotsWrap.querySelectorAll('.dot').forEach(d => {
      d.addEventListener('click', () => go(parseInt(d.dataset.i, 10)));
    });
  }
</script>
</body>
</html>
